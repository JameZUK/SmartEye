[project]
name = "smarteye"
version = "0.1.0"
description = "Door-camera visitor intelligence for Blue Iris, fed by ImmichEye"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "paho-mqtt>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pillow>=10.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["smarteye"]

[tool.setuptools.package-data]
smarteye = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
